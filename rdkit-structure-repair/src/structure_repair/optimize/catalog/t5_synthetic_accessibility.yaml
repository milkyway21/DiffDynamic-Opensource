  smarts: '[#6:4][CH;r3:1]1[CH2;r3:2][CH2;r3:3]1>>[#6:4][CH:1]([CH3:2])[CH3:3]'
  delta_heavy: 0
  cost: 2.0
  rationale: 探索环丙基开环到异丙基后的构象与合成路径；环丙基可能是关键药效团。
  positive_examples:
  - CC1CC1
  negative_examples:
  - C1CCC1
- id: T5_TBU_TO_IPR
