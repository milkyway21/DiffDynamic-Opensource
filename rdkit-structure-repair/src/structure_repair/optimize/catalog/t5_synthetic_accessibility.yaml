  cost: 3.0
  rationale: 探索环丁烷开环后构象自由度的变化；四元环并不必然难以合成。
  positive_examples:
  - C1CCC1
  negative_examples:
  - C1CCCC1
- id: T5_GEM_DIFLUORO_TO_CH2
  name: gem-二氟 → 亚甲基
  smarts: '[#6:1][CX4:2](F)(F)[#6:3]>>[#6:1][CH2:2][#6:3]'
