  smarts: '[#6:1][CX4:2]([CH3:3])([CH3:4])[CH3]>>[#6:1][CH:2]([CH3:3])[CH3:4]'
  delta_heavy: -1
  cost: 1.5
  rationale: 探索叔丁基减小为异丙基后的疏水性与空间占据；需要验证结合。
  positive_examples:
  - CC(C)(C)c1ccccc1
  negative_examples:
  - CC(C)c1ccccc1
- id: T5_QUATERNARY_CARBON_DEMETHYL
  name: 季碳去甲基
  smarts: '[#6:1][CX4:2]([#6:3])([#6:4])[CH3]>>[#6:1][CH:2]([#6:3])[#6:4]'
  delta_heavy: -1
  cost: 2.0
  rationale: 探索季碳去甲基后的构象、立体异构和合成难度；不保证合成可及性改善。
  positive_examples:
  - CCC(C)(C)c1ccccc1
  negative_examples:
  - CCC(C)c1ccccc1
- id: T5_OPEN_STRAINED_CYCLOBUTANE
  name: 环丁烷开环
  smarts: '[CH2;r4:1]1[CH2;r4:2][CH2;r4:3][CH2;r4:4]1>>[CH3:1][CH2:2][CH2:3][CH3:4]'
