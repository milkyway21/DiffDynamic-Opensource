tier: T3
description: 代谢软点封堵与结构警示消除
transforms:
- id: T3_NITRO_TO_NITRILE
  name: 芳硝基 → 氰基
  smarts: '[c:1][NX3+](=[OX1])[OX1-]>>[c:1]C#N'
  delta_heavy: -1
  cost: 2.0
  rationale: 用氰基替代芳硝基以探索电子性质与警示子结构变化；安全性需独立验证。
  positive_examples:
  - O=[N+]([O-])c1ccccc1
  negative_examples:
  - CC[N+](=O)[O-]
- id: T3_NITRO_TO_TRIFLUOROMETHYL
  name: 芳硝基 → 三氟甲基
  smarts: '[c:1][NX3+](=[OX1])[OX1-]>>[c:1]C(F)(F)F'
  delta_heavy: 1
  cost: 2.0
  rationale: 用三氟甲基替代芳硝基以探索吸电子和亲脂性变化；不保证降低毒性。
  positive_examples:
  - O=[N+]([O-])c1ccccc1
  negative_examples:
  - CC[N+](=O)[O-]
- id: T3_NITRO_TO_METHYLSULFONYL
  name: 芳硝基 → 甲砜基
  smarts: '[c:1][NX3+](=[OX1])[OX1-]>>[c:1]S(=O)(=O)C'
  delta_heavy: 1
  cost: 2.5
  rationale: 用甲砜基替代芳硝基以探索极性与电子性质；代谢和毒理谱需实验测定。
  positive_examples:
  - O=[N+]([O-])c1ccccc1
  negative_examples:
  - CC[N+](=O)[O-]
- id: T3_ANILINE_ACYLATION
  name: 芳伯胺 → 乙酰胺
  smarts: '[c:1][NX3H2:2]>>[c:1][N:2]C(=O)C'
  delta_heavy: 3
  cost: 2.0
  rationale: 探索芳伯胺乙酰化对碱性、代谢及氢键能力的影响；可能仍存在水解或代谢风险。
  positive_examples:
  - Nc1ccccc1
  negative_examples:
  - CNc1ccccc1
- id: T3_ALDEHYDE_TO_NITRILE
  name: 醛 → 腈
  smarts: '[#6:1][CX3H1:2]=[OX1:3]>>[#6:1][C:2]#[N:3]'
  delta_heavy: 0
  cost: 2.0
  rationale: 探索醛到腈的替换以改变亲电性和几何；结合和反应性仍需验证。
  positive_examples:
  - O=Cc1ccccc1
  negative_examples:
  - CC(=O)c1ccccc1
- id: T3_MICHAEL_ACCEPTOR_SATURATE
  name: 迈克尔受体 → 饱和羰基
  smarts: '[#6:1][CH:2]=[CH:3][CX3:4]=[OX1:5]>>[#6:1][CH2:2][CH2:3][C:4]=[O:5]'
  delta_heavy: 0
  cost: 2.0
  rationale: 探索饱和迈克尔受体后的反应性与构象；可能移除设计的共价作用，仅用于激进改造。
  positive_examples:
  - CC=CC(=O)C
  negative_examples:
  - CCCC(=O)C
- id: T3_THIOUREA_TO_UREA
  name: 硫脲 → 脲
  smarts: '[NX3:1][CX3:2](=[SX1:4])[NX3:3]>>[N:1][C:2](=[O:4])[N:3]'
  delta_heavy: 0
  cost: 2.0
  rationale: 探索硫脲到脲的替换对氢键和代谢的影响；不据此推断毒性降低。
  positive_examples:
  - CNC(=S)NC
  negative_examples:
  - CNC(=O)NC
- id: T3_EPOXIDE_OPEN
  name: 环氧 → 邻二醇开环
  smarts: '[CX4:1]1[OX2:2][CX4:3]1>>[C:1]([O:2])[C:3]O'
  delta_heavy: 1
  cost: 2.5
  rationale: 将环氧开环为邻二醇以探索极性与反应性；不代表已证明安全或可合成。
  positive_examples:
  - CC1CO1
  negative_examples:
  - CCCO
- id: T3_ARYL_OME_TO_OCF3
  name: 芳甲氧基 → 三氟甲氧基
  smarts: '[c:1][OX2:2][CH3:3]>>[c:1][O:2][C:3](F)(F)F'
  delta_heavy: 3
  cost: 2.0
  rationale: 探索芳甲氧基氟化对 O-脱烷基代谢及亲脂性的影响；其他代谢途径仍需评估。
  positive_examples:
  - COc1ccccc1
  negative_examples:
  - CCOc1ccccc1
- id: T3_ARYL_OME_TO_OCHF2
  name: 芳甲氧基 → 二氟甲氧基
  smarts: '[c:1][OX2:2][CH3:3]>>[c:1][O:2][CH:3](F)F'
  delta_heavy: 2
  cost: 2.0
  rationale: 探索二氟甲氧基的代谢和理化性质；改善幅度与方向需测定。
  positive_examples:
  - COc1ccccc1
  negative_examples:
  - CCOc1ccccc1
- id: T3_BENZYLIC_CH2_TO_CF2
  name: 苄位 CH2 → CF2
  smarts: '[c:1][CH2;!R:2][#6:3]>>[c:1][C:2](F)(F)[#6:3]'
  delta_heavy: 2
  cost: 2.5
  rationale: 探索苄位二氟化对氧化代谢和构象的影响；不能保证封闭代谢通路。
  positive_examples:
  - CCc1ccccc1
  negative_examples:
  - CCC
- id: T3_BENZYLIC_CH2_TO_CHF
  name: 苄位 CH2 → CHF
  smarts: '[c:1][CH2;!R:2][#6:3]>>[c:1][CH:2](F)[#6:3]'
  delta_heavy: 1
  cost: 2.0
  rationale: 探索苄位单氟化对代谢、构象及新立体中心的影响；需比较各异构体。
  positive_examples:
  - CCc1ccccc1
  negative_examples:
  - CCC
