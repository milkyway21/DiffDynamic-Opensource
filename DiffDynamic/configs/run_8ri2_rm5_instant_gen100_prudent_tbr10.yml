# 8RI2 RM5：100 瞬时 + Scaffold-Prudent（非 baseline30）
# 与 gaussian 版相同 Murcko 位点释放（centroid+N(0,1), max_active_sites=1）
# RNG: np.random.default_rng(42 + sample_idx * 9973)
# 输出：experiments/8ri2_rm5_instant_gen100_prudent_tbr10/

model:
  checkpoint: ./pretrained_models/pretrained_diffusion.pt
  force_model_type: diffdynamic
  use_grad_fusion: true
  grad_fusion_lambda:
    mode: quadratic
    start: 1
    end: 0
    power: 2

sample:
  seed: 42
  mode: dynamic
  num_steps: 1000
  sample_num_atoms: prior
  center_pos_mode: protein
  pos_only: false

  dynamic:
    method: legacy
    time_boundary: 650
    skip_refine: true
    large_step:
      batch_size: 5
      n_repeat: 1
      schedule: lambda
      lambda_coeff_a: 58
      lambda_coeff_b: 20
      linear_step_lower: 15
      linear_step_upper: 15
      step_size: 0.33
      stride: 15
      noise_scale: 0.1
      use_adaptive_step: true
      use_time_scale: false
    refine:
      n_sampling: 1
      cycles: 1
      schedule: lambda
      lambda_coeff_a: 60
      lambda_coeff_b: 5
      linear_step_lower: 3
      linear_step_upper: 8
      step_size: 0.47
      stride: 5
      time_lower: 0
      noise_scale: 0.05
      use_adaptive_step: true
      use_time_scale: false
      max_grad_fusion_iterations: 15

  # 结束后追加 TargetDiff 10 步修复（start_t=9）
  targetdiff_baseline_refine:
    enable: true
    start_t: 9
    after_scaffold_init_only: false

  scaffold:
    enable: true
    mode: prudent
    scaffold_source: auto_murcko
    fix_scaffold_pos: true
    fix_scaffold_type: true
    num_samples: 100

    murcko_sites:
      p_active: 0.5
      max_per_site: 20
      min_per_site: 0
      per_site_count_mode: sequential_random
      jitter_std: 1.0
      jitter_mode: gaussian
      max_active_sites: 1
      prefer_murcko_sites: true
      save_json: true
      overflow_mode: cap
      dedup_dist: 0.5
      include_exit_vectors: false

    prudent:
      n_generations: 5
      n_chains_per_seed: 20
      advance_top_k: 2
      renoise_t: 600
      qed_weight: 0.2
      sa_weight: 0.2
      vina_weight: 0.6
      lipinski_weight: 0.0
      lilly_demerit_weight: 0.1
      vina_exhaustiveness: 8
      min_qed_for_docking: 0.2
      min_sa_for_docking: 0.2
      advance_top_k_mode: cap
      continue_when_no_advance: true
      fallback_keep_top_k: 1
      async_vina_max_workers: 4
      max_logp: 4.5
      max_molwt: 550
      max_heavy_atoms: 45
      max_rings: 7

    grow:
      n_extra_mode: prior_minus_scaffold
      n_extra_min_clamp: 1
      n_extra_max_clamp: 12
      min_qed: 0.0
      min_sa: 0.0
      filter_incomplete: false
