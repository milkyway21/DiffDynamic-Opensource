# 6W63 生产：dynamic_locked + Murcko位点 + 原子限制 + TargetDiff baseline 30步
# 100 分子；跳过 grad-fusion large_step/refine

model:
  checkpoint: ./pretrained_models/pretrained_diffusion.pt
  force_model_type: diffdynamic
  use_grad_fusion: true
  grad_fusion_lambda:
    mode: quadratic
    start: 1
    end: 0
    power: 2

sample:
  seed: 42
  mode: dynamic
  num_steps: 1000
  sample_num_atoms: prior
  center_pos_mode: protein
  pos_only: false

  dynamic:
    method: legacy
    time_boundary: 650
    skip_refine: true
    large_step:
      batch_size: 5
      n_repeat: 1
      schedule: lambda
      lambda_coeff_a: 58
      lambda_coeff_b: 20
      linear_step_lower: 15
      linear_step_upper: 15
      step_size: 0.33
      stride: 15
      noise_scale: 0.1
      use_adaptive_step: true
      use_time_scale: false
    refine:
      n_sampling: 1
      cycles: 1
      schedule: lambda
      lambda_coeff_a: 60
      lambda_coeff_b: 5
      linear_step_lower: 3
      linear_step_upper: 8
      step_size: 0.47
      stride: 5
      time_lower: 0
      noise_scale: 0.05
      use_adaptive_step: true
      use_time_scale: false
      max_grad_fusion_iterations: 15

  targetdiff_baseline_refine:
    enable: true
    after_scaffold_init_only: true
    start_t: 29
    refine_batch_size: 10

  scaffold:
    enable: true
    mode: dynamic_locked
    scaffold_source: auto_murcko
    fix_scaffold_pos: true
    fix_scaffold_type: true
    num_samples: 100

    murcko_sites:
      p_active: 0.5
      max_per_site: 20
      min_per_site: 0
      per_site_count_mode: sequential_random
      jitter_std: 1.0
      jitter_mode: gaussian
      max_active_sites: 1
      prefer_murcko_sites: true
      save_json: true
      overflow_mode: cap
      dedup_dist: 0.5

    grow:
      n_extra_mode: prior_minus_scaffold
      n_extra_min_clamp: 1
      n_extra_max_clamp: 12
      min_qed: 0.0
      min_sa: 0.0
      filter_incomplete: false
