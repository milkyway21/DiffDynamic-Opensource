[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdkit-structure-repair"
version = "0.1.0"
description = "Deterministic RDKit molecular structure repair (no ML)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
structure-repair = "structure_repair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
